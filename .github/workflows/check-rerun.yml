# Re-runs once a first attempt of check that kern-platforms-queue cancelled because a platform leg
# never got a runner (SE's README "Platform legs and their queue"); SE's scripts/ci_queue.py rerun,
# at the commit se.lock locks, decides from the run's jobs, so a run that failed, or a second
# attempt, is left as it ended.
name: check rerun

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: The SE commit se.lock locks
        id: se
        run: echo "ref=$(python3 -c 'import tomllib; print(tomllib.load(open("se.lock", "rb"))["modules"]["se"]["ref"])')" >> "$GITHUB_OUTPUT"
      - name: SE at kern's pin
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SE
          ref: ${{ steps.se.outputs.ref }}
          path: .se/ci/se
      - name: Re-run a first attempt whose platform leg never got a runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .se/ci/se/scripts/ci_queue.py rerun --jobs kern-platforms --run ${{ github.event.workflow_run.id }}
